name: NextA one-time UI patch

on:
  push:
    branches: [flutter-v2]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore(ui): set FAB height and stack calendar markers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-v2
          fetch-depth: 0
      - name: Apply requested UI changes
        shell: python
        run: |
          from pathlib import Path

          editor = Path('flutter/lib/presentation/widgets/event_editor_sheet_v2.dart')
          text = editor.read_text()
          text = text.replace(
              'padding: const EdgeInsets.fromLTRB(56, 6, 56, 10),',
              'padding: const EdgeInsets.fromLTRB(56, 6, 56, 30),',
              1,
          )
          text = text.replace(
              'child: SizedBox(\n        height: 31,\n        child: Row(',
              'child: SizedBox(\n        height: 60,\n        child: Row(',
              1,
          )
          editor.write_text(text)

          planner = Path('flutter/lib/presentation/planner_screen.dart')
          text = planner.read_text()
          text = text.replace(
              'Positioned(left: 72, right: 72, bottom: 14, child: PlannerFab(',
              'Positioned(left: 72, right: 72, bottom: 30, child: PlannerFab(',
              1,
          )
          text = text.replace(
              'child: SizedBox(\n          height: 31,\n          child: Padding(',
              'child: SizedBox(\n          height: 60,\n          child: Padding(',
              1,
          )
          planner.write_text(text)

          calendar = Path('flutter/lib/presentation/widgets/planner_calendar.dart')
          text = calendar.read_text()
          old = '''            Row(
              mainAxisAlignment: MainAxisAlignment.center,
              children: markerEvents
                  .map(
                    (event) => Container(
                      width: 20,
                      height: 4,
                      margin: const EdgeInsets.symmetric(horizontal: 1.5),
                      decoration: BoxDecoration(
                        color: nextAPriorityColor(event.priority),
                        borderRadius: BorderRadius.circular(3),
                      ),
                    ),
                  )
                  .toList(),
            ),'''
          new = '''            SizedBox(
              width: 32,
              height: 9,
              child: Stack(
                alignment: Alignment.bottomCenter,
                clipBehavior: Clip.none,
                children: [
                  for (var i = 0; i < markerEvents.length; i++)
                    Positioned(
                      left: 2 + (i * 2),
                      right: 2 + (i * 2),
                      bottom: i * 3.0,
                      child: Container(
                        height: 4,
                        decoration: BoxDecoration(
                          color: nextAPriorityColor(markerEvents[i].priority),
                          borderRadius: BorderRadius.circular(3),
                        ),
                      ),
                    ),
                ],
              ),
            ),'''
          if old not in text:
              raise SystemExit('calendar marker block not found')
          calendar.write_text(text.replace(old, new, 1))
      - name: Commit and remove patch workflow
        run: |
          rm .github/workflows/ui_patch_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib/presentation/widgets/event_editor_sheet_v2.dart flutter/lib/presentation/planner_screen.dart flutter/lib/presentation/widgets/planner_calendar.dart .github/workflows/ui_patch_once.yml
          git commit -m "chore(ui): set FAB height and stack calendar markers"
          git push origin flutter-v2
