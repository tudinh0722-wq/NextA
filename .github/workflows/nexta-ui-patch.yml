name: NextA UI patch

on:
  push:
    branches: [flutter-v2]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(ui): refine FAB and calendar markers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: flutter-v2
          fetch-depth: 0
      - name: Apply UI patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          editor = Path('flutter/lib/presentation/widgets/event_editor_sheet_v2.dart')
          text = editor.read_text()
          text = text.replace(
              "padding: const EdgeInsets.fromLTRB(56, 6, 56, 10),\n          child: _BottomActionFab",
              "padding: const EdgeInsets.fromLTRB(56, 6, 56, 30),\n          child: _BottomActionFab",
          )
          text = text.replace(
              "child: SizedBox(\n        height: 31,\n        child: Row(",
              "child: SizedBox(\n        height: 60,\n        child: Row(",
          )
          editor.write_text(text)

          planner = Path('flutter/lib/presentation/planner_screen.dart')
          text = planner.read_text()
          text = text.replace(
              "Positioned(left: 72, right: 72, bottom: 14, child: PlannerFab(",
              "Positioned(left: 72, right: 72, bottom: 30, child: PlannerFab(",
          )
          text = text.replace(
              "child: SizedBox(\n          height: 31,\n          child: Padding(",
              "child: SizedBox(\n          height: 60,\n          child: Padding(",
          )
          planner.write_text(text)

          calendar = Path('flutter/lib/presentation/widgets/planner_calendar.dart')
          text = calendar.read_text()
          old = '''            Row(\n              mainAxisAlignment: MainAxisAlignment.center,\n              children: markerEvents\n                  .map(\n                    (event) => Container(\n                      width: 20,\n                      height: 4,\n                      margin: const EdgeInsets.symmetric(horizontal: 1.5),\n                      decoration: BoxDecoration(\n                        color: nextAPriorityColor(event.priority),\n                        borderRadius: BorderRadius.circular(3),\n                      ),\n                    ),\n                  )\n                  .toList(),\n            ),'''
          new = '''            SizedBox(\n              width: 32,\n              height: 9,\n              child: Stack(\n                alignment: Alignment.bottomCenter,\n                clipBehavior: Clip.none,\n                children: [\n                  for (var i = 0; i < markerEvents.length; i++)\n                    Positioned(\n                      left: 2 + (i * 2),\n                      right: 2 + (i * 2),\n                      bottom: i * 3.0,\n                      child: Container(\n                        height: 4,\n                        decoration: BoxDecoration(\n                          color: nextAPriorityColor(markerEvents[i].priority),\n                          borderRadius: BorderRadius.circular(3),\n                        ),\n                      ),\n                    ),\n                ],\n              ),\n            ),'''
          if old not in text:
              raise SystemExit('Calendar marker block not found')
          calendar.write_text(text.replace(old, new))
          PY

          rm .github/workflows/nexta-ui-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flutter/lib/presentation/widgets/event_editor_sheet_v2.dart flutter/lib/presentation/planner_screen.dart flutter/lib/presentation/widgets/planner_calendar.dart .github/workflows/nexta-ui-patch.yml
          git commit -m "chore(ui): refine FAB and calendar markers"
          git push origin flutter-v2
